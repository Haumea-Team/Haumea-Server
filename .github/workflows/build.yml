name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build (static)
        run: make
      - name: Check
        run: make check && tests/smoke.sh build/haumea-server
      - uses: actions/upload-artifact@v4
        with:
          name: haumea-server-linux-x86_64
          path: build/haumea-server
          if-no-files-found: error

  windows:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install MinGW-w64
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mingw-w64
      - name: Build
        run: make windows
      - uses: actions/upload-artifact@v4
        with:
          name: haumea-server-windows-x86_64
          path: build/haumea-server.exe
          if-no-files-found: error

  # A v* tag publishes a release with both builds.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir out
          cp dist/haumea-server-linux-x86_64/haumea-server out/haumea-server-linux-x86_64
          cp dist/haumea-server-windows-x86_64/haumea-server.exe out/haumea-server-windows-x86_64.exe
          chmod +x out/haumea-server-linux-x86_64
          (cd out && sha256sum * > SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" out/* deploy/install.sh deploy/haumea-session.service deploy/env.example \
            --title "haumea-server $GITHUB_REF_NAME" --generate-notes
